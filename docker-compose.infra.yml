# PuddingClaw Local Infra Compose
#
# 用途：
#   本地客户端/本地开发模式下，frontend 和 backend 直接在宿主机运行；
#   Docker 负责基础设施：Milvus，以及可选 bundled PostgreSQL。
#   MinerU 按本机服务运行，使用 scripts/setup-mineru.py 或 scripts/start-mineru-host.sh 启动。
#
# 端口保持与现有部署约定一致：
#   Milvus:          grpc://localhost:19530
#   PostgreSQL:      postgresql://localhost:5432  # 可选 bundled；仅供显式选择
#                    PostgreSQL Core 或 gbrain(pgvector) 使用；Core 默认 SQLite，
#                    不启动本服务也不影响桌面/本地默认体验。已有本机 PostgreSQL 时可外接
#   MinerU API:      http://localhost:8002  # 本机运行，不在本 compose 内
#
# 启动：
#   docker compose -f docker-compose.infra.yml up -d
#   # 推荐使用 scripts/start-local-infra.sh，它会检测本机已有 PostgreSQL，避免强占 5432。
#
# PostgreSQL 模式：
#   PUDDINGCLAW_POSTGRES_MODE=detect    默认；5432 被非 Docker 本机服务占用时跳过 bundled postgres。
#   PUDDINGCLAW_POSTGRES_MODE=bundled   强制启动本 compose 的 postgres service。
#   PUDDINGCLAW_POSTGRES_MODE=external  明确使用用户已有 PostgreSQL，本 compose 不启动 postgres service。
#
# Bundled PostgreSQL 默认账号：
#   database: puddingclaw
#   username: puddingclaw
#   password: puddingclaw
#
# 本地 backend 推荐环境变量（仅当显式选择 PostgreSQL Core / gbrain 时；
# Core 默认 SQLite，无需设置 DATABASE_URL）：
#   DATABASE_URL=postgresql+asyncpg://puddingclaw:puddingclaw@127.0.0.1:5432/puddingclaw
#   MINERU_URL=http://localhost:8002

services:
  postgres:
    # pgvector is required by gbrain (LLM Wiki) and by PostgreSQL Core;
    # SQLite Core（默认）不需要本服务。
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:pg16}
    container_name: puddingclaw-postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-puddingclaw}
      - POSTGRES_USER=${POSTGRES_USER:-puddingclaw}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-puddingclaw}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - type: bind
        source: ${PUDDINGCLAW_HOST_HOME:-${HOME}/.puddingclaw}/infrastructure/postgres
        target: /var/lib/postgresql/data
      - ./scripts/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} && psql -U $${POSTGRES_USER} -d $${POSTGRES_DB} -Atqc \"select 1 from pg_available_extensions where name='vector'\" | grep -qx 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  milvus-etcd:
    image: ${ETCD_IMAGE:-quay.io/coreos/etcd:v3.5.18}
    container_name: puddingclaw-milvus-etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - type: bind
        source: ${PUDDINGCLAW_HOST_HOME:-${HOME}/.puddingclaw}/infrastructure/milvus/etcd
        target: /etcd
    command: >
      etcd
      --advertise-client-urls=http://milvus-etcd:2379
      --listen-client-urls=http://0.0.0.0:2379
      --initial-advertise-peer-urls=http://milvus-etcd:2380
      --listen-peer-urls=http://0.0.0.0:2380
      --data-dir=/etcd
    restart: unless-stopped

  milvus-minio:
    image: ${MINIO_IMAGE:-minio/minio:RELEASE.2025-04-22T22-12-26Z}
    container_name: puddingclaw-milvus-minio
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    # MinIO 只作为 Milvus 内部对象存储使用；默认不暴露控制台端口，
    # 避免和本机已有 MinIO/其他服务冲突。如需调试控制台，可设置：
    #   MINIO_CONSOLE_PORT=19001 docker compose -f docker-compose.infra.yml up -d
    ports:
      - "${MINIO_CONSOLE_PORT:-127.0.0.1:19001}:9001"
    volumes:
      - type: bind
        source: ${PUDDINGCLAW_HOST_HOME:-${HOME}/.puddingclaw}/infrastructure/milvus/minio
        target: /minio_data
    command: minio server /minio_data --console-address ":9001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus:
    image: ${MILVUS_IMAGE:-milvusdb/milvus:v2.5.4}
    container_name: puddingclaw-milvus
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
    volumes:
      - type: bind
        source: ${PUDDINGCLAW_HOST_HOME:-${HOME}/.puddingclaw}/infrastructure/milvus/data
        target: /var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - milvus-etcd
      - milvus-minio
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
