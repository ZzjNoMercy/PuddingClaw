[project]
name = "puddingclaw-backend"
version = "0.1.17"
description = "PuddingClaw backend API, agent, and knowledge base services"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [
    { name = "PuddingClaw Team" },
]
keywords = ["agent", "rag", "knowledge-base", "llm"]

dependencies = [
    # Web framework
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "sse-starlette>=3.3.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27,<0.29",
    # Data validation & settings
    "pydantic>=2.12.0",
    "pydantic-settings>=2.13.0",
    "python-dotenv>=1.0.0",
    # Database (Core defaults to SQLite; PostgreSQL drivers live in the
    # optional `postgres` extra below).
    "sqlalchemy[asyncio]>=2.0.48",
    "aiosqlite>=0.22.0",
    # LangChain / LangGraph
    "deepagents>=0.6.12",
    "langchain>=1.3.11",
    "langchain-core>=1.4.8",
    "langchain-community>=0.4.2",
    "langchain-deepseek>=1.1.0",
    "langchain-openai>=1.3.3",
    "langchain-mcp-adapters>=0.3.0",
    "langgraph>=1.2.6",
    "langsmith>=0.9.2",
    "urllib3>=2.0",
    # LLM provider SDKs
    "openai>=2.28.0",
    # Context engineering / token counting
    "tiktoken>=0.12.0",
    # Document / media processing
    "pillow>=12.0.0",
    "beautifulsoup4>=4.14.0",
    "html2text>=2025.0.0",
    "lxml>=6.0.0",
    "PyYAML>=6.0.0",
    "filetype>=1.2.0",
    # Utilities
    "aiohttp>=3.13.0",
    "anyio>=4.12.0",
    "requests>=2.32.0",
    "tenacity>=9.0.0",
    "tqdm>=4.67.0",
    "xxhash>=3.4.0",
    "uuid-utils>=0.14.0",
    "cryptography>=49.0.0",
    "filelock>=3.29.0",
    "langchain-experimental>=0.4.1",
]

[project.optional-dependencies]
# PostgreSQL 驱动：PostgreSQL Core Catalog、Analytics PostgreSQL 数据源、
# gbrain/pgvector 共用此 extra。Core 默认 SQLite（aiosqlite 已在基础依赖），
# 不安装本 extra 也可正常运行；选择 PostgreSQL 时才需要 `pip install .[postgres]`。
postgres = [
    "asyncpg>=0.29.0",
]

evaluation = [
    # Official SWE-bench Docker verifier. Keep this exact and resolved through
    # uv.lock; evaluation workers never download Python code at run time.
    "swebench==4.1.0",
]

knowledge = [
    "pymilvus==2.6.15",
    "llama-index-core>=0.14.17",
    "llama-index-embeddings-openai>=0.6.0",
    "llama-index-retrievers-bm25>=0.7.0",
    "rank-bm25>=0.2.2",
    "jieba>=0.42.1",
    "pandas>=2.3.0",
    "pyarrow>=18.0.0",
    "openpyxl>=3.1.0",
    "xlrd>=2.0.1",
    "transformers>=4.57.3,<5.0.0",
    "tokenizers>=0.22.0",
    "safetensors>=0.7.0",
]

analytics = [
    "pymilvus==2.6.15",
    "pandas>=2.3.0",
    "pyarrow>=18.0.0",
    "openpyxl>=3.1.0",
    "xlrd>=2.0.1",
    "sqlparse>=0.5.0",
    "tabulate>=0.9.0",
    "plotly>=6.0.0",
    "sqlglot>=30.0",
]

# PDF rich parsing via MinerU (base package, no vllm/lmdeploy GPU backends).
# Recommended for macOS/CPU. For Linux/Windows GPU acceleration, install
# `mineru[all]` separately; it currently conflicts with this project's
# openai>=2.28.0 / llama-index-core setuptools constraints.
mineru = [
    # MinerU pipeline backend. Using the [pipeline] extra pulls in torch,
    # torchvision, transformers, ftfy, shapely, pyclipper, onnxruntime, etc.
    # Native MinerU is mainly for macOS here; Linux users are steered to the
    # official Docker image so we do not pull CUDA wheels into the lock.
    "mineru[pipeline]>=3.0; sys_platform == 'darwin'",
    # MinerU 3.4.0 imports `six` from its bundled OCR pipeline but does not
    # declare it in package metadata, so keep it explicit for native MinerU.
    "six>=1.17.0; sys_platform == 'darwin'",
]

# Milvus vector store (optional infrastructure; pinned versions).
# Note: llama-index-vector-stores-milvus currently requires pymilvus<3.
milvus = [
    "llama-index-vector-stores-milvus==1.1.0",
]

# Multimodal embedding provider used by MinerU PDF RAG.
multimodal = [
    "dashscope>=1.24.0",
]

[project.scripts]
puddingclaw-api = "app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# 后端是扁平多包应用，显式声明需要打进 editable wheel 的模块/包。
only-include = [
    "app.py",
    "backend_lease.py",
    "capabilities.py",
    "catalog_backup.py",
    "catalog_migration.py",
    "cli_runtime.py",
    "config.py",
    "db.py",
    "db_maintenance.py",
    "gbrain_runtime.py",
    "headless_session_lifecycle.py",
    "observability.py",
    "postgres_dependencies.py",
    "provider_registry.py",
    "higress_config_reader.py",
    "runtime_control.py",
    "schema_migrations.py",
    "worker_access.py",
    "extensions.py",
    "api",
    "analytics",
    "connectors",
    "evaluation",
    "graph",
    "harness",
    "knowledge",
    "llm",
    "mcp_clients",
    "prompts",
    "projects",
    "runtime_identity",
    "services",
    "skills",
    "tools",
    "utils",
    "vanna",
    "web_search",
]

[tool.uv]
# uv 管理项目依赖
managed = true

[dependency-groups]
# 开发/测试依赖（不影响生产环境）
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-httpx>=0.30.0",
    "ruff>=0.6.0",
    "mypy>=1.0.0",
]

# Optional latest-DeepAgents compatibility test environment.
# DeepAgents itself is now a runtime dependency; this group only adds notebook/test helpers.
deepagents-test = [
    "ipykernel>=7.0.0",
    "langgraph-cli>=0.1.0",
]

[tool.uv.pip]
# 国内用户可加速 PyTorch 下载
extra-index-url = [
    "https://download.pytorch.org/whl/cpu",
]

[tool.pytest.ini_options]
# Runtime Skill sources and managed Skill snapshots may contain their own
# upstream tests with duplicate module names and independent dependencies.
# The backend's authoritative suite lives under tests/; Skill tests are run by
# their own adapters, not by an unscoped backend pytest invocation.
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
