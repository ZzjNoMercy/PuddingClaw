<!doctype html>
<html lang="zh-CN" data-theme="light" data-report-status="draft">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="产品配置专题分析 HTML 报告模板" />
  <title>产品配置专题分析报告模板</title>
  <link rel="stylesheet" href="report-theme.css" />
</head>
<body>
  <main class="report-shell" data-screen-label="产品配置专题分析报告">
    <header class="report-header">
      <div class="report-heading">
        <p class="report-kicker">Product Configuration · Topic Report</p>
        <h1 class="report-title" id="report-title">产品配置专题分析报告模板</h1>
        <p class="report-subtitle" id="report-subtitle">围绕一个具体问题生成轻量、可追溯的可视化专题报告</p>
        <ul class="report-meta" id="report-meta" hidden></ul>
      </div>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="切换报告颜色主题" aria-pressed="false">切换深色</button>
    </header>

    <p class="report-summary" id="report-summary" hidden></p>
    <div class="status-banner" id="status-banner" role="status">模板待生成：请完成查询后一次性替换 #report-payload。</div>

    <section class="kpi-grid" id="kpi-grid" aria-label="关键指标" hidden></section>

    <section class="insights" id="insights" aria-labelledby="insights-title" hidden>
      <h2 class="section-label" id="insights-title">核心发现</h2>
      <div class="insight-list" id="insight-list"></div>
    </section>

    <div class="blocks" id="blocks" hidden></div>

    <section class="methodology" id="methodology" aria-labelledby="methodology-title" hidden>
      <h2 class="section-label" id="methodology-title">口径与说明</h2>
      <ul class="method-list" id="method-list"></ul>
    </section>

    <footer class="report-footer">
      <span>由 PuddingClaw 产品配置分析模型生成 · ECharts 6.1.0</span>
      <span id="footer-date"></span>
    </footer>
  </main>

  <script src="echarts-6.1.0.min.js"></script>
  <script id="report-payload" type="application/json">
{
  "schema_version": "1.0",
  "report": {
    "title": null,
    "subtitle": null,
    "summary": null,
    "report_date": null,
    "data_cutoff": null,
    "scope": {
      "period": null,
      "market": null,
      "grain": null,
      "filters": []
    }
  },
  "kpis": [],
  "insights": [],
  "blocks": [],
  "methodology": [],
  "evidence": {},
  "quality": {
    "status": "draft",
    "warnings": []
  }
}
  </script>
  <script src="report-renderer.js"></script>
</body>
</html>
