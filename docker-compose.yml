# PuddingClaw Docker Compose（旧 full-stack 部署文件）
#
# 当前推荐部署方式：
#   1. PostgreSQL/Milvus: docker compose -f docker-compose.infra.yml up -d
#   2. frontend/backend: scripts/start-macos-linux.sh
#
# Core 模式：
#   docker compose up --build -d
#
# 访问：
#   前端：http://localhost:3000
#   后端 API：http://localhost:8888
#   API 文档：http://localhost:8888/docs
# Provider 凭证和模型绑定由本地客户端 Provider Registry 管理，模型请求直连 Provider。

services:
  postgres:
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:pg16}
    container_name: puddingclaw-postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-puddingclaw}
      - POSTGRES_USER=${POSTGRES_USER:-puddingclaw}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-puddingclaw}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} && psql -U $${POSTGRES_USER} -d $${POSTGRES_DB} -Atqc \"select 1 from pg_available_extensions where name='vector'\" | grep -qx 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: puddingclaw-backend
    ports:
      - "8888:9100"
    env_file:
      - ./backend/.env
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-chat}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=9100
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://puddingclaw:puddingclaw@postgres:5432/puddingclaw}
      # 其他环境变量在 backend/.env 中配置（如 MINERU_URL）
    volumes:
      # 持久化会话、workspace、memory、日志到宿主机
      - ./backend/sessions:/app/sessions
      - ./backend/workspace:/app/workspace
      - ./backend/memory:/app/memory
      - ./backend/data:/app/data
      - ./backend/knowledge:/app/knowledge
      - ./backend/logs:/app/logs
      # 挂载 skills，允许容器内 API/工具写入（import/save/rename/version）
      - ./backend/skills:/app/skills
      # 挂载静态系统提示词文件，便于在容器外修改后无需重建镜像
      - ./backend/prompts:/app/prompts:ro
      # 挂载 .env 与 config.json，便于在容器外修改配置
      - ./backend/.env:/app/.env:ro
      - ./backend/config.json:/app/config.json
      - ./logging.yaml:/app/logging.yaml:ro
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9100/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: puddingclaw-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      # 浏览器请求同源 /api，由 Next 容器转发到后端服务。
      - BACKEND_INTERNAL_URL=http://backend:9100
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

# 可选：使用外部网络，便于与其他服务（如 Milvus）集成
# networks:
#   default:
#     name: puddingclaw-network

volumes:
  postgres_data:
