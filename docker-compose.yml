# PuddingClaw Docker Compose（旧 full-stack 部署文件）
#
# 当前推荐部署方式：
#   1. PostgreSQL/Milvus: docker compose -f docker-compose.infra.yml up -d
#   2. frontend/backend: scripts/start-macos-linux.sh
#
# Core 模式：
#   docker compose up --build -d
#
# 数据库说明：
#   Core 默认使用 SQLite（backend 内置，无需 PostgreSQL/Docker 数据库）。
#   本文件中的 postgres 服务仅供显式选择 PostgreSQL Core 或启用 gbrain(pgvector)
#   时使用；需要时请显式设置 PUDDINGCLAW_DATABASE_URL（见 backend 服务注释）。
#
# 访问：
#   前端：http://localhost:3000
#   后端 API：http://localhost:8888
#   API 文档：http://localhost:8888/docs
# Provider 凭证和模型绑定由本地客户端 Provider Registry 管理，模型请求直连 Provider。

services:
  # Core 默认 SQLite，不依赖本服务。仅供以下场景使用：
  #   1. 显式选择 PostgreSQL Core（设置 PUDDINGCLAW_DATABASE_URL 指向本服务）；
  #   2. gbrain(pgvector) 知识图谱运行时。
  # 本服务挂在 `postgres` profile 下，普通 `docker compose up` 不会启动；
  # 显式需要时用 `docker compose --profile postgres up -d`。
  postgres:
    profiles: ["postgres"]
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:pg16}
    container_name: puddingclaw-postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-puddingclaw}
      - POSTGRES_USER=${POSTGRES_USER:-puddingclaw}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-puddingclaw}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} && psql -U $${POSTGRES_USER} -d $${POSTGRES_DB} -Atqc \"select 1 from pg_available_extensions where name='vector'\" | grep -qx 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: puddingclaw-backend
    ports:
      - "8888:9100"
    env_file:
      - ./backend/.env
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-chat}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=9100
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      # Deployment override recognized by backend/config.py. Generic DATABASE_URL
      # is intentionally ignored so inherited shell variables cannot silently
      # disagree with Settings.
      # 默认为空：Core 使用 SQLite。显式选择 PostgreSQL Core（或 gbrain 指向本
      # compose 的 postgres）时再设置，例如：
      #   PUDDINGCLAW_DATABASE_URL=postgresql+asyncpg://puddingclaw:puddingclaw@postgres:5432/puddingclaw
      - PUDDINGCLAW_DATABASE_URL=${PUDDINGCLAW_DATABASE_URL:-}
      - PUDDINGCLAW_HOME=/app/.puddingclaw
      # 其他环境变量在 backend/.env 中配置（如 MINERU_URL）
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      # User-visible Home is a host bind mount. SQLite stays on a Docker-managed
      # filesystem so WAL/locking semantics do not depend on Desktop sharing.
      - type: bind
        source: ${PUDDINGCLAW_HOST_HOME:-${HOME}/.puddingclaw}
        target: /app/.puddingclaw
      - type: volume
        source: puddingclaw_db
        target: /app/.puddingclaw/db
      - type: bind
        source: ./logging.yaml
        target: /app/logging.yaml
        read_only: true
    restart: unless-stopped
    # Core 默认 SQLite，postgres 服务已挂到 `postgres` profile。depends_on 引用
    # 带 profile 的服务会要求 backend 也加入该 profile，因此这里不再声明依赖：
    # 当 PUDDINGCLAW_DATABASE_URL 指向本 compose 的 postgres 时，请用
    # `docker compose --profile postgres up -d` 一并启动 postgres。
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9100/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: puddingclaw-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      # 浏览器请求同源 /api，由 Next 容器转发到后端服务。
      - BACKEND_INTERNAL_URL=http://backend:9100
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

# 可选：使用外部网络，便于与其他服务（如 Milvus）集成
# networks:
#   default:
#     name: puddingclaw-network

volumes:
  postgres_data:
  puddingclaw_db:
